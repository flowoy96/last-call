{% extends "base.html" %}
{% block title %}Setup · Last Call{% endblock %}
{% block content %}
<article class="narrow">
  <h2>Welcome to Last Call</h2>
  <p>Create the admin account to get started. You can change everything else later in the settings.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" value="admin" required autocomplete="username"></label>
    <label>Password <small>(min. 10 characters)</small><input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
    <label>Repeat password <input type="password" name="password2" minlength="10" required autocomplete="new-password"></label>
    <button type="submit">Create admin</button>
  </form>
</article>
{% endblock %}
